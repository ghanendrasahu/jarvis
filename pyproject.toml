[project]
name = "jarvis"
version = "1.3.2"
description = "Voice-first desktop and browser automation assistant with an autonomous agent and job-application automation."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "openai==1.57.2",
    "requests==2.32.3",
    "playwright==1.50.0",
    "psutil==6.1.0",
    "pyautogui==0.9.54",
    "pygetwindow==0.0.9",
    "pyttsx3==2.98",
    "SpeechRecognition==3.10.4",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    "yt-dlp>=2024.12.13",
    "webrtcvad-wheels==2.0.14",  # prebuilt wheels; upstream webrtcvad fails to build on Windows py311
    "rapidfuzz>=3.9",  # fuzzy matching for wake-word variants and entity correction
    "PyAudio==0.2.14; sys_platform == 'win32'",  # microphone capture (speech_recognition.Microphone)
    "pywin32>=306; sys_platform == 'win32'",  # SAPI TTS + audio output devices (win32com)
    "pystray>=0.19.5",
    "PySide6>=6.6",  # desktop HUD (app/gui.py, minihud, toast)
    "Pillow>=10.0.0",  # tray icon rendering (app/tray.py)
    "pyperclip>=1.9.0",  # cross-platform clipboard (no tkinter dependency)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
litellm = [
    "litellm>=1.60.0",
]
stt-qwen = [
    "torch",  # CPU build sufficient; Qwen3-ASR runs fp32 on CPU
    "transformers>=5.13",  # 5.13+ ships Qwen3ASRForConditionalGeneration
]
tts = [
    "kokoro>=0.8.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Legacy large handler: raises within broad `except Exception:` blocks; keep as-is.
"app/tools/browser_tools.py" = ["B904"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/*"]
[project]
name = "jarvis"
version = "1.1.0"
description = "Voice-first desktop and browser automation assistant with an autonomous agent and job-application automation."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "openai==1.57.2",
    "requests==2.32.3",
    "playwright==1.50.0",
    "psutil==6.1.0",
    "pyautogui==0.9.54",
    "pygetwindow==0.0.9",
    "pyttsx3==2.98",
    "SpeechRecognition==3.10.4",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    "yt-dlp>=2024.12.13",
    "webrtcvad==2.0.10",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
test = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Legacy large handler: raises within broad `except Exception:` blocks; keep as-is.
"app/tools/browser_tools.py" = ["B904"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["app"]
omit = ["app/gui*.py", "app/voice/speaker.py"]

[tool.coverage.report]
fail_under = 60
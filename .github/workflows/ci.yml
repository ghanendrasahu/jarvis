name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        # Pinned: unpinned installs broke CI when new rule sets shipped.
        run: pip install ruff==0.16.4
      - name: Lint
        run: ruff check app tests

  typecheck:
    name: Typecheck
    # Windows-only stdlib (winreg, winsound, ctypes.windll) is only visible to
    # mypy when it analyzes for sys.platform == "win32", so typecheck on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install mypy==2.3.1
          pip install -r requirements.txt
      - name: Typecheck
        run: mypy app

  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          pip install -e .[dev]
          pip install pytest==9.1.1
      - name: Run tests
        run: pytest tests -q

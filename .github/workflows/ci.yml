name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dev deps
        # Pinned so rule-set changes can never break CI silently.
        run: pip install ruff==0.17.1
      - name: Lint
        run: ruff check app tests

  typecheck:
    name: Typecheck
    # Windows-only stdlib (winreg, winsound, ctypes.windll) is only visible to
    # mypy when it analyzes for sys.platform == "win32", so typecheck on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        # Deterministic tree: everything pinned in requirements.lock.
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Typecheck
        run: mypy app

  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked dependencies + package
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Run tests
        run: pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=30
